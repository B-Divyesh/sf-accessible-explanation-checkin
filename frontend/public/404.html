<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — Accessible Explanation Check-in</title>
    <style>
      :root{color-scheme:light dark;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#f3eedf;color:#172a27}body{margin:0;min-width:320px;line-height:1.55}main{max-width:720px;margin:0 auto;padding:clamp(64px,12vw,140px) 24px}a{color:#9d421c;text-underline-offset:.18em}.mark{width:32px;height:42px;border:3px solid #9d421c;border-bottom:0;display:block;margin-bottom:44px}h1{font:500 clamp(2.4rem,8vw,4.5rem)/1.05 Charter,Cambria,Georgia,serif;margin:0 0 20px}p{max-width:58ch;font-size:1.1rem}.button{display:inline-block;margin-top:20px;padding:13px 19px;background:#9d421c;color:#fff;text-decoration:none;font-weight:700;border-radius:4px}@media(prefers-color-scheme:dark){:root{background:#102522;color:#f7f1e4}a{color:#f0a56a}.mark{border-color:#f0a56a}.button{background:#f0a56a;color:#172a27}}:focus-visible{outline:3px solid #9d421c;outline-offset:4px}
    </style>
  </head>
  <body><main><span class="mark" aria-hidden="true"></span><p>404 · Page not found</p><h1>That page is not available</h1><p>The link may be incomplete. Check the whole private link, or return home to create a check-in.</p><a class="button" href="/">Return home</a></main></body>
